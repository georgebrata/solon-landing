# On-demand IndexNow submission of every URL in sitemap.xml (mode B).
# Does not deploy. The script logs the API status and always exits 0.

name: IndexNow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: submit all sitemap URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Submit every sitemap URL to IndexNow
        run: node scripts/indexnow.js --all
