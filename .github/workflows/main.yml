# Production pipeline for solon.agency
#
# Policy: pull requests never FTP-deploy. CI Production runs targeted checks on every
# push/PR; the full npm test suite runs on pull_request (Tests workflow) and on
# push to main (test-suite job). FTP deploy runs only after CI succeeds on push to
# main or an intentional workflow_dispatch.
#
# This file supersedes the outdated claim in issue #21 that .github/workflows/
# is empty. Lighthouse CI and W3C HTML validation from #21 remain follow-ups.
#
# Branch protection (human, Settings → Branches → main): mark the "ci" check
# required before merging. Agents cannot always change org/repo rules.

name: CI Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Rebuild when the "Abonamente" sheet changes: POST /repos/SOLON-Agency/solon-landing/dispatches
  # with {"event_type":"abonamente-updated"} (token needs to be set up by George; see PR).
  repository_dispatch:
    types: [abonamente-updated]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 LTS (Jod) confirmed still in LTS on https://nodejs.org as of 2026-10.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Test forms
        run: npm run test:forms

      - name: Test feature flags
        run: npm run test:flags

      - name: Test asset cache-busting
        run: npm run test:assets

      - name: Test error pages
        run: npm run test:error-pages

      - name: Test IndexNow URL selection
        run: npm run test:indexnow

      - name: Test pricing build (snapshot)
        run: npm run test:pricing

      - name: Test homepage sheets privacy
        run: npm run test:homepage-sheets

      - name: Check homepage sheets build
        run: node scripts/build-homepage-sheets.js --offline --check

      - name: Test blog sheet append script
        run: npm run test:append-sheets

      - name: Test short links
        run: npm run test:shortlinks

      - name: Check short links build
        run: node scripts/build-shortlinks.js --offline --check

      - name: Apache short-link smoke
        run: bash scripts/smoke-shortlinks-apache.sh

      - name: Audit dependencies
        run: npm audit --audit-level=high

  test-suite:
    name: test-suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Fetch origin/main for HTML validate git probes
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Install Chrome for gtag browser test
        run: npx puppeteer browsers install chrome

      - name: Run full unit and integration tests
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: npm test

  deploy:
    name: deploy
    needs: [ci, test-suite]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    steps:
      # Full history: lastmod is the last commit that changed page content.
      # A shallow clone cannot tell that commit from a cache-bust commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # dangerous-clean-slate is intentionally omitted (defaults to false).
      # Do not enable it: that flag wipes server-dir including excluded paths.
      # The action still deletes remote files that are in the previous sync
      # state and no longer in the local publish set. Excluded globs are
      # omitted from both upload and delete (applyExcludeFilter on local and
      # server lists), so previously leaked tooling files will not be removed
      # by CI — clean those up in cPanel. .htaccess is uploaded (not excluded).
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Build-time pricing from SOLON API (tabs Abonamente + Servicii).
      # On API failure it logs ::error:: and keeps the committed snapshot.
      - name: Build pricing from SOLON API
        env:
          SHEETS_API_URL: ${{ vars.SHEETS_API_URL }}
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
        run: node scripts/build-pricing.js

      - name: Build homepage FAQ and testimonials from SOLON API
        env:
          SHEETS_API_URL: ${{ vars.SHEETS_API_URL }}
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
        run: node scripts/build-homepage-sheets.js

      - name: Ensure homepage sheets snapshot was not rewritten on deploy
        run: git diff --exit-code data/homepage-sheets.snapshot.json

      # After pricing. On API failure it logs ::error:: and does not rewrite the snapshot, .htaccess, or r/.
      - name: Build short links from SOLON API
        env:
          SHEETS_API_URL: ${{ vars.SHEETS_API_URL }}
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
        run: node scripts/build-shortlinks.js

      # After pricing, so a sheet-driven homepage edit is dated today.
      # The file is uploaded by FTP and not committed: open blog PRs also
      # edit sitemap.xml, and a follow-up commit on main would collide with them.
      - name: Refresh sitemap lastmod from page history
        run: node scripts/update-sitemap.js --from-git

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ftp.solon.agency
          username: deploy@solon.agency
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Root *.txt is part of the publish set: robots.txt, llms.txt, and the
          # IndexNow key file /<32 lowercase hex>.txt. Do not exclude *.txt.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/tests/**
            **/docs/**
            **/.github/**
            **/.githooks/**
            **/.agents/**
            **/skills/**
            **/.cursorrules
            **/AGENTS.md
            **/package.json
            **/package-lock.json
            **/.gitignore
            **/.deepsource.toml
            **/feature-flags.json
            **/scripts/**
            **/templates/**
            **/blog/posts/**
            **/data/**
            **/*.md
            !**/assets/**/*.md
            **/LICENSE
            **/*.jsonl
            **/assets/scss/**
            **/.ftp-deploy-sync-state.json
            !**/.htaccess

      # After FTP: optional snapshot commit on main ([skip ci] avoids dispatch/CI loops). Never blocks deploy.
      # Short-link snapshot, .htaccess, and r/ ride along in this same bot commit.
      - name: Commit refreshed abonamente snapshot
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data/abonamente.snapshot.json data/shortlinks.snapshot.json .htaccess r)" ]; then
            echo "Snapshots unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/abonamente.snapshot.json data/shortlinks.snapshot.json .htaccess r
          git commit -m "chore(pricing): refresh abonamente snapshot [skip ci]"
          git pull --rebase --autostash origin main || { echo "::warning::snapshot push: git pull --rebase failed"; exit 0; }
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
            || echo "::warning::snapshot push failed (FTP deploy already succeeded)"

  # Pings IndexNow only after a successful FTP deploy on push to main.
  # continue-on-error plus the script's exit 0 keep a failed ping from
  # failing the workflow or blocking deploy (this job does not gate deploy).
  indexnow:
    name: indexnow
    needs: deploy
    if: success() && needs.deploy.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_SHA: ${{ github.sha }}
        run: node scripts/indexnow.js
