name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run form validation tests
        run: npm run test:forms

      - name: Run consent tests
        run: npm run test:consent

      - name: Install Chrome for gtag browser test
        run: npx puppeteer browsers install chrome

      - name: Run gtag browser test (skips when GTM unreachable)
        run: npm run test:gtag-browser

      - name: Run feature flag tests
        run: npm run test:flags

      - name: Run asset cache-busting tests
        run: npm run test:assets

      - name: Run error page tests
        run: npm run test:error-pages

      - name: Run IndexNow tests
        run: npm run test:indexnow

      - name: Run blog sheet append tests
        run: npm run test:append-sheets
