version = 1

exclude_patterns = [
  "node_modules/**",
  "tests/fixtures/**",
  "assets/vendor/**",
  "**/*.min.js",
  "**/*.min.css",
  "assets/img/**",
  "assets/pdfs/**",
  "templates/**",
  "docs/**"
]

test_patterns = [
  "tests/**"
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "browser"]
  module_system = "commonjs"

[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"
